# Run the unit tests for every push and submitted pull request, and keep the
# reports when something fails so a red run can be inspected without rebuilding
# locally.

name: test

on:
  - pull_request
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Execute Gradle test
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: koreanify-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/